<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido - Restaurante do Pedro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h2>Pedido de Restaurante</h2>
    
    <form action="#" method="POST">
        
        <div class="form-control">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-control">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seu-email@provedor.com" required>
        </div>

        <div class="form-control">
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 67676-7676" required>
        </div>

        <div class="form-control">
            <label for="data-entrega">Data do Pedido:</label>
            <input type="date" id="data-entrega" name="data_entrega" required>
        </div>

        <div class="form-control">
            <label for="prato-principal">Escolha o Prato:</label>
            <select id="prato-principal" name="prato_principal" required>
                <option value="" disabled selected>Selecione uma opção...</option>
                <option value="lasanha">Lasanha à Bolonhesa</option>
                <option value="pizza">Pizza Margherita</option>
                <option value="risoto">Risoto de Cogumelos</option>
                <option value="file">Filé Mignon</option>
            </select>
        </div>

        <div class="form-control">
            <label for="senha">Senha da Conta:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-submit">Enviar Pedido</button>

    </form>
</div>

</body>
</html>
